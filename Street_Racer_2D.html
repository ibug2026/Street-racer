<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Street Racer 2D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
  canvas{display:block;margin:auto;background:#222;touch-action:none}
  #info{position:fixed;top:8px;left:50%;transform:translateX(-50%);color:white;font-weight:bold;text-shadow:0 2px 4px #000;z-index:3;pointer-events:none}
  #controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;z-index:4;pointer-events:none}
  button{pointer-events:auto;width:82px;height:62px;border:2px solid #fff8;border-radius:18px;background:#222c;color:white;font-size:28px;font-weight:bold}
  #menu{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:10;color:white;text-align:center}
  #panel{background:#181818;border:2px solid #555;border-radius:20px;padding:25px;max-width:430px;margin:20px;box-shadow:0 10px 40px #000}
  #start{width:180px;height:55px;background:#2d8cff;border:0;font-size:20px}
  .small{font-size:13px;color:#bbb;line-height:1.4}
</style>
</head>
<body>
<div id="info"></div>
<canvas id="game" width="720" height="1000"></canvas>

<div id="controls">
  <button id="left">◀</button>
  <button id="brake">●</button>
  <button id="right">▶</button>
</div>

<div id="menu">
 <div id="panel">
   <h1>🏁 Street Racer 2D</h1>
   <p>10 levels • Single player • Easy controls</p>
   <p class="small">Keyboard: A/D or ←/→ to steer, W/↑ to accelerate, S/↓ to brake.</p>
   <p class="small">On a phone/tablet, use the buttons at the bottom.</p>
   <button id="start">START RACE</button>
 </div>
</div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
let level=1, playing=false, distance=0, speed=0, roadOffset=0, last=0;
let score=0, best=0, shake=0;
const keys={};
const player={x:W/2,y:H-180,w:58,h:105,color:'#e21d2e'};
let traffic=[];
const levels=[
 {name:"City Start",len:9000,max:8,traffic:2},
 {name:"Downtown",len:10500,max:9,traffic:3},
 {name:"Coastal Road",len:12000,max:10,traffic:3},
 {name:"Night Drive",len:13500,max:11,traffic:4},
 {name:"Mountain Run",len:15000,max:12,traffic:4},
 {name:"Desert Highway",len:16500,max:13,traffic:5},
 {name:"Rainy Streets",len:18000,max:13,traffic:5},
 {name:"Expressway",len:19500,max:14,traffic:6},
 {name:"Grand Prix",len:21500,max:15,traffic:6},
 {name:"Championship",len:24000,max:16,traffic:7}
];

function resetLevel(){
 distance=0; speed=0; roadOffset=0; traffic=[];
 for(let i=0;i<levels[level-1].traffic;i++) spawnCar(300+i*240);
}
function spawnCar(y){
 const lane=Math.floor(Math.random()*3);
 const laneX=W/2-170+lane*170;
 traffic.push({x:laneX,y:-y,w:54,h:100,color:["#1d65d8","#f2b705","#21a366","#8d44ad","#eee","#111"][Math.floor(Math.random()*6)],vy:1+Math.random()*1.2});
}
function roadBounds(){return {l:W/2-280,r:W/2+280}}
function drawRoad(){
 const b=roadBounds();
 ctx.fillStyle='#4f8b3a';ctx.fillRect(0,0,W,H);
 // roadside
 for(let y=-40+(roadOffset%80);y<H;y+=80){
   ctx.fillStyle=(Math.floor((y+roadOffset)/80)%2?'#fff':'#d33');
   ctx.fillRect(b.l-18,y,18,42);ctx.fillRect(b.r,y,18,42);
 }
 ctx.fillStyle='#333';ctx.fillRect(b.l,0,b.r-b.l,H);
 ctx.fillStyle='#777';ctx.fillRect(b.l+8,0,8,H);ctx.fillRect(b.r-16,0,8,H);
 // lane markings
 ctx.strokeStyle='#eee';ctx.lineWidth=8;ctx.setLineDash([60,55]);
 ctx.lineDashOffset=roadOffset;
 for(let x=b.l+187;x<b.r;x+=187){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
 ctx.setLineDash([]);
}
function drawCar(car, isPlayer=false){
 ctx.save();ctx.translate(car.x,car.y);
 // shadow
 ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,car.h*.48,car.w*.58,12,0,0,Math.PI*2);ctx.fill();
 // body
 ctx.fillStyle=car.color;roundRect(-car.w/2,-car.h/2,car.w,car.h,12);ctx.fill();
 // windows
 ctx.fillStyle='#182a3a';roundRect(-car.w*.34,-car.h*.33,car.w*.68,car.h*.30,8);ctx.fill();
 ctx.fillStyle='#29485a';roundRect(-car.w*.34,2,car.w*.68,car.h*.23,6);ctx.fill();
 // lights
 ctx.fillStyle='#fff2aa';roundRect(-car.w*.39,-car.h*.45,12,8,3);ctx.fill();roundRect(car.w*.19,-car.h*.45,12,8,3);ctx.fill();
 ctx.fillStyle='#f22';roundRect(-car.w*.39,car.h*.37,12,8,3);ctx.fill();roundRect(car.w*.19,car.h*.37,12,8,3);ctx.fill();
 // wheels
 ctx.fillStyle='#111';ctx.fillRect(-car.w/2-5,-car.h*.33,8,25);ctx.fillRect(car.w/2-3,-car.h*.33,8,25);
 ctx.fillRect(-car.w/2-5,car.h*.15,8,25);ctx.fillRect(car.w/2-3,car.h*.15,8,25);
 if(isPlayer){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();}
 ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function update(dt){
 const L=levels[level-1], b=roadBounds();
 let accel=keys.ArrowUp||keys.w||keys.W, brake=keys.ArrowDown||keys.s||keys.S;
 if(accel) speed+=20*dt; else speed-=7*dt;
 if(brake) speed-=28*dt;
 speed=Math.max(3,Math.min(L.max,speed));
 const steer=keys.ArrowLeft||keys.a||keys.A ? -1 : keys.ArrowRight||keys.d||keys.D ? 1 : 0;
 player.x += steer*(220+speed*7)*dt;
 player.x=Math.max(b.l+45,Math.min(b.r-45,player.x));
 roadOffset += speed*80*dt;
 distance += speed*70*dt;
 traffic.forEach(car=>{car.y += (speed*55+car.vy*35)*dt;});
 for(const car of traffic){
   if(Math.abs(car.x-player.x)<48 && Math.abs(car.y-player.y)<82){
     speed*=0.35; shake=8; score=Math.max(0,score-150); car.y=-300;
   }
   if(car.y>H+150){car.y=-500-Math.random()*700;car.x=W/2-170+Math.floor(Math.random()*3)*170;}
 }
 if(distance>=L.len){
   score+=1000*level; level++;
   if(level>10){playing=false;showMenu("🏆 CHAMPION!","You completed all 10 levels! Final score: "+score);}
   else {showMenu("LEVEL "+(level-1)+" COMPLETE!","Get ready for "+levels[level-1].name+" — Level "+level);resetLevel();}
 }
}
function draw(){
 ctx.save();
 if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9;}
 drawRoad();
 // distant scenery
 ctx.fillStyle='#2e6b31';
 for(let x=20;x<W;x+=75){let yy=(x*17+roadOffset*.25)%H;ctx.beginPath();ctx.arc(x,yy,16,0,Math.PI*2);ctx.fill();}
 traffic.forEach(car=>drawCar(car));
 drawCar(player,true);
 ctx.restore();
 // HUD
 ctx.fillStyle='#000b';ctx.fillRect(15,15,690,70);
 ctx.fillStyle='white';ctx.font='bold 22px Arial';
 ctx.fillText(`LEVEL ${level}/10  •  ${levels[level-1].name}`,30,45);
 ctx.font='18px Arial';ctx.fillText(`Speed: ${Math.round(speed*12)} km/h    Progress: ${Math.min(100,Math.round(distance/levels[level-1].len*100))}%    Score: ${score}`,30,72);
}
function loop(t){
 const dt=Math.min(.035,(t-last)/1000||0);last=t;
 if(playing) update(dt);
 draw();requestAnimationFrame(loop);
}
function showMenu(title,sub){
 document.querySelector('#panel h1').textContent=title;
 document.querySelector('#panel p').textContent=sub;
 document.querySelector('#panel .small').textContent=playing?'Press START to continue.':'Press START to race again.';
 document.querySelectorAll('#panel .small')[1].style.display='none';
 document.getElementById('menu').style.display='flex';
}
function start(){
 document.getElementById('menu').style.display='none';
 playing=true;resetLevel();
}
document.getElementById('start').onclick=()=>{
 if(level>10){level=1;score=0;}
 start();
};
addEventListener('keydown',e=>{keys[e.key]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();});
addEventListener('keyup',e=>keys[e.key]=false);
function hold(id,k){const el=document.getElementById(id);el.onpointerdown=e=>{e.preventDefault();keys[k]=true};el.onpointerup=el.onpointercancel=el.onpointerleave=e=>{keys[k]=false};}
hold('left','ArrowLeft');hold('right','ArrowRight');hold('brake','ArrowDown');
requestAnimationFrame(loop);
</script>
</body>
</html>
